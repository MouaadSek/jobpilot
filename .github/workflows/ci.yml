name: CI

on:
  push:
    # Every branch, not just main: a branch that only runs CI once it is opened
    # as a pull request gets its first honest signal after the work is done.
    # The .venv break in Task 39 sat green locally for four commits because
    # nothing ran until the PR existed.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          typer python-dotenv httpx pyyaml apscheduler pypdf
          pytest ruff respx fastapi uvicorn jinja2

      - name: Install JobPilot without ML dependencies
        run: python -m pip install --no-deps -e .

      - name: Guard frozen matcher
        if: github.event_name == 'pull_request'
        run: git diff --exit-code origin/main...HEAD -- matcher.py src/jobpilot/matcher.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  dependency-audit:
    name: Dependency audit / ubuntu-latest
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight runtime and audit dependencies
        # pip-audit audits the whole environment, which includes the packaging
        # tools the runner ships with — setuptools 79.0.1 carries PYSEC-2026-3447,
        # fixed in 83.0.0. Upgrading them is the honest fix: --ignore-vuln would
        # silence a real advisory and would keep silencing it after the runner
        # image caught up.
        run: >-
          python -m pip install --upgrade pip setuptools
          typer python-dotenv httpx pyyaml apscheduler pypdf
          pytest ruff respx fastapi uvicorn jinja2 pip-audit

      - name: Install JobPilot without ML dependencies
        run: python -m pip install --no-deps -e .

      - name: Audit installed environment
        run: pip-audit
