name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          typer python-dotenv httpx pyyaml apscheduler pypdf
          pytest ruff respx fastapi uvicorn jinja2

      - name: Install JobPilot without ML dependencies
        run: python -m pip install --no-deps -e .

      - name: Guard frozen matcher
        if: github.event_name == 'pull_request'
        run: git diff --exit-code origin/main...HEAD -- matcher.py src/jobpilot/matcher.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  dependency-audit:
    name: Dependency audit / ubuntu-latest
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight runtime and audit dependencies
        run: >-
          python -m pip install
          typer python-dotenv httpx pyyaml apscheduler pypdf
          pytest ruff respx fastapi uvicorn jinja2 pip-audit

      - name: Install JobPilot without ML dependencies
        run: python -m pip install --no-deps -e .

      - name: Audit installed environment
        run: pip-audit
