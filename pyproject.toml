[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal job application pipeline for the French IT/cybersecurity market"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "playwright>=1.46",
    "weasyprint>=62; sys_platform != 'win32'",
    "pypdf>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # torch caps at 2.2.2 on Intel macOS (no newer x86_64 wheels); pin the ML
    # stack to versions that are mutually compatible with it.
    "numpy<2",
    "torch>=2.2,<2.3",
    "transformers>=4.40,<4.46",
    "sentence-transformers>=3.0,<3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[tool.setuptools]
# matcher.py is a frozen top-level module at the repo root (constitution: never
# moved, renamed or edited), so it is declared here rather than discovered.
# package-dir maps the jobpilot package to src/ *per package* instead of
# rerooting the whole distribution at src/ — that leaves the implicit root at
# the repo root, which is where setuptools then finds matcher.py. Declaring it
# under a `packages.find where = ["src"]` layout does NOT work: py-modules
# would be resolved as src/matcher.py and silently dropped from the wheel,
# which is the `ModuleNotFoundError: No module named 'matcher'` bug.
py-modules = ["matcher"]
packages = ["jobpilot", "jobpilot.sources"]

[tool.setuptools.package-dir]
jobpilot = "src/jobpilot"

[tool.setuptools.package-data]
jobpilot = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# matcher.py is a vendored asset driven as-is (constitution: do not fork/modify).
extend-exclude = ["matcher.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
