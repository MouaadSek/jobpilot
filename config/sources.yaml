# Which ingestion sources `jobpilot ingest` runs.
#
# A source not listed here defaults to enabled. `ingest --source all` runs only
# enabled sources; naming a disabled source explicitly is skipped with a notice.

sources:
  france_travail:
    enabled: true
  ats:
    enabled: true
  # LinkedIn/Indeed job-alert email parsing (needs GMAIL_ADDRESS + GMAIL_APP_PASSWORD).
  # Skipped gracefully until those are set.
  linkedin_alert:
    enabled: true
  indeed_alert:
    enabled: true
  # Welcome to the Jungle via Algolia (needs WTTJ_API_KEY). Skipped until set.
  wttj:
    enabled: true
  # La Bonne Alternance through the API Apprentissage (needs LBA_API_KEY).
  # Skipped gracefully until that is set, like the other keyed sources.
  labonnealternance:
    enabled: true
