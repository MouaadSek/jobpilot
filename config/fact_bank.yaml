experience:
- id: experience.baifall
  employer: Baïfall Dream
  role: 'Stage : Étude et Développement d''une Plateforme d''e-Facturation'
  dates: Juillet 2026 - Présent
  location: Paris
  facts:
  - id: experience.baifall.redaction.du.cahier.des.charges.d.une
    text: 'Rédaction du cahier des charges d''une plateforme d''e-facturation (réforme B2B 2026) : benchmark de 3 plateformes, 95 exigences.'
  - id: experience.baifall.conception.et.developpement.de.la.plateforme
    text: 'Conception et développement de la plateforme : génération Factur-X/UBL, modèle de données, API REST, cycle de vie des factures.'
  - id: experience.baifall.definition.des.exigences.de.securite.applicative
    text: 'Définition des exigences de sécurité applicative : authentification, gestion des accès, chiffrement, RGPD art. 32, Factur-X/UBL.'
  - id: experience.baifall.cadrage.complet.du.projet.benchmark
    text: 'Cadrage complet du projet : benchmark, périmètre MVP vs V2, plan en deux volets (développement et immatriculation DGFiP).'
  - id: experience.baifall.etude.comparative.de.3.solutions.du
    text: 'Étude comparative de 3 solutions et recommandation d''architecture : build interne connecté à une plateforme agréée via API.'
  - id: experience.baifall.definition.des.exigences.reglementaires.et.securite
    text: 'Définition des exigences réglementaires : immatriculation DGFiP, ISO 27001, authentification, chiffrement, RGPD art. 32.'
  - id: experience.baifall.specification.d.une.architecture.secure.by.design
    text: 'Spécification d''une architecture secure by design : authentification, chiffrement, journalisation, intégration API Factur-X/UBL.'
  - id: experience.baifall.cadrage.reglementaire.immatriculation.dgfip.certification
    text: 'Cadrage réglementaire : immatriculation DGFiP, certification ISO 27001 (périmètre SMSI), conformité RGPD art. 32.'
  - id: experience.baifall.specification.de.la.gestion.des.identites
    text: 'Spécification de la gestion des identités et des accès : authentification, rôles et permissions, traçabilité (ISO 27001).'
  - id: experience.baifall.specification.des.exigences.de.journalisation.et
    text: Spécification des exigences de journalisation et de traçabilité (ISO 27001, RGPD art. 32) en vue de sa supervision sécurité.
  - id: experience.baifall.analyse.des.exigences.d.hebergement.localisation.ue
    text: Analyse des exigences d'hébergement (localisation UE, SecNumCloud) et spécifications sécurité de l'infrastructure (ISO 27001).
